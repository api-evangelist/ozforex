aid: ozforex
name: OFX (OzForex)
description: 'OFX (formerly OzForex) is a global money-transfer and international-payments
  company that has been moving and managing money globally for over 25 years, trading
  as USForex Inc. in North America. Beyond consumer and business FX, OFX offers a partner
  Payments API: a RESTful API for international mass payments to 170+ countries in
  50+ currencies, covering live exchange-rate quotes, recipient account management,
  and automated payment processing for invoices, payroll, and bulk supplier payments.
  Developers can build and test against an open sandbox environment before going live,
  authenticating with API keys. OFX is a registered Money Service Business with FinCEN
  (NMLS #1021624) and a licensed money transmitter across multiple U.S. states.'
